[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-transcripts"
version = "0.1.0"
description = "View and annotate Claude Code sessions"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "David Page" }]
dependencies = []

[project.scripts]
transcripts = "claude_transcripts.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_transcripts"]
